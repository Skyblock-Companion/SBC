name: Bug report
description: Something in the mod is broken or acts weird
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more you fill in, the faster it gets fixed.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The jar name or what the mod menu shows, like beta-0.1
      placeholder: beta-0.1
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft and Fabric Loader version
      placeholder: Minecraft 26.2, Fabric Loader 0.17.x
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Tell what went wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to make it happen again
      placeholder: |
        1. Go to ...
        2. Open ...
        3. See ...
  - type: textarea
    id: log
    attributes:
      label: latest.log
      description: Paste your log from .minecraft/logs/latest.log (or drop the file here)
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drop pictures or videos here if you have them
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: Other mods you play with, or the modpack name
