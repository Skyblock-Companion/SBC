plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

// each Minecraft version is its own project under versions/, all built from the same src/ by Stonecutter
def mc = stonecutter.current.version

version = project.mod_version
group = 'io.muzy'
base { archivesName = 'sbc' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // fabric api is a dependency the player installs next to the mod, not packed in the jar
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // hypixel mod api, comes from the HypixelModAPI mod at runtime (optional)
    compileOnly rootProject.files('libs/mod-api-1.0.2.jar')
    // parser tests run on real text from /sbc dump (src/test/resources/samples)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = [version: project.version, minecraft: mc, fabric_api: project.fabric_version.split('[+]')[0]]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
    from(rootProject.file('LICENSE')) { rename { 'LICENSE-SkyBlockCompanion.txt' } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    // what's new reads the changelog from the jar
    from(rootProject.file('docs/CHANGELOG.md')) { into 'assets/sbcompanion'; rename { 'changelog.md' } }
}

// sbc-beta-0.2-mc26.3.jar: the Minecraft version in the name, like SkyHanni's jars
tasks.named('jar') { archiveFileName = "${project.jar_name}-mc${mc}.jar" }

// the tests read src/ and docs/ where they run, and write to build/ there. they run in a copy of this version's own
// source, so each Minecraft version checks its own code and not the other one's lines in comments
def testRoot = layout.buildDirectory.dir('test-root')
def prepareTestRoot = tasks.register('prepareTestRoot', Sync) {
    dependsOn 'compileJava', 'compileTestJava', 'processResources', 'processTestResources'
    into testRoot
    from(sourceSets.main.java.srcDirs) { into 'src/main/java' }
    from(sourceSets.main.resources.srcDirs) { into 'src/main/resources' }
    from(sourceSets.test.resources.srcDirs) { into 'src/test/resources' }
    from(rootProject.file('docs')) { into 'docs' }
    from(rootProject.file('audit')) { into 'audit' }
    from(rootProject.file('gradle.properties'))
    // what the tests wrote last time stays
    preserve { include 'build/**' }
}
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn prepareTestRoot
    workingDir = testRoot.get().asFile
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

loom {
    // what ui/layout needs from the games graphics object + screen
    accessWidenerPath = rootProject.file('src/main/resources/sbcompanion.accesswidener')
    runs {
        client {
            vmArg '-Dsbc.dev=true'
            vmArg "-Dsbc.hud=${System.getenv('SBC_HUD') ?: 'false'}"
            vmArg "-Dsbc.cycle=${System.getenv('SBC_CYCLE') ?: 'false'}"
            vmArg '-Djavax.net.ssl.trustStoreType=Windows-ROOT'
            programArgs '--quickPlaySingleplayer', 'sbctest'
        }
    }
}
