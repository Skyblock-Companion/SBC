plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

version = project.mod_version
group = 'io.github.zmuzy'
base { archivesName = 'sbc' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // fabric api is a dependency the player installs next to the mod, not packed in the jar
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // hypixel mod api, comes from the HypixelModAPI mod at runtime (optional)
    compileOnly files('libs/mod-api-1.0.2.jar')
    // parser tests run on real text from /sbc dump (src/test/resources/samples)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    from('LICENSE') { rename { 'LICENSE-SkyBlockCompanion.txt' } }
    from('THIRD_PARTY_NOTICES.md')
    // what's new reads the changelog from the jar
    from('docs/CHANGELOG.md') { into 'assets/sbcompanion'; rename { 'changelog.md' } }
}

tasks.named('jar') { archiveFileName = "${project.jar_name}.jar" }

tasks.named('test', Test) { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

loom {
    // what ui/layout needs from the games graphics object + screen
    accessWidenerPath = file('src/main/resources/sbcompanion.accesswidener')
    runs {
        client {
            vmArg '-Dsbc.dev=true'
            vmArg "-Dsbc.hud=${System.getenv('SBC_HUD') ?: 'false'}"
            vmArg "-Dsbc.cycle=${System.getenv('SBC_CYCLE') ?: 'false'}"
            vmArg '-Djavax.net.ssl.trustStoreType=Windows-ROOT'
            programArgs '--quickPlaySingleplayer', 'sbctest'
        }
    }
}
